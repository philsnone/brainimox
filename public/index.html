<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#7ec8ff">
  <title>Brainimox</title>
  <link rel="preload" href="fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="spiel"></canvas>

  <!-- Startbildschirm -->
  <div id="start" class="schicht">
    <h1>Brainimox</h1>
    <p>Welche Klasse bist du?</p>
    <div class="knoepfe">
      <button class="gross" data-klasse="3">Klasse 3</button>
      <button class="gross" data-klasse="4">Klasse 4</button>
    </div>
    <p class="klein">Tippen = Springen · Länger drücken = höher · P = Pause</p>
    <button class="klein-knopf" id="bestenlisteKnopf">🏆 Bestenliste</button>
  </div>

  <!-- Matheaufgabe -->
  <div id="aufgabe" class="schicht versteckt">
    <p class="frage" id="frage"></p>
    <div class="knoepfe" id="antworten"></div>
    <p class="meldung" id="meldung"></p>
  </div>

  <!-- Ende -->
  <div id="ende" class="schicht versteckt">
    <h1 id="endeTitel">Geschafft!</h1>
    <p id="ergebnis"></p>
    <!-- Laden zwischen den Leveln -->
    <div id="laden" class="laden">
      <button class="klein-knopf kaufen" id="schwertKaufen">⚔️ Schwert kaufen</button>
      <p class="klein" id="ladenMeldung"></p>
    </div>
    <div class="knoepfe">
      <button class="gross" id="nochmal">Nochmal</button>
    </div>
  </div>

  <!-- Name eintippen -->
  <div id="namen" class="schicht versteckt">
    <p class="titel-klein">Super gespielt! <span id="namenMuenzen"></span></p>
    <p>Wie heißt du?</p>
    <div id="namenFeld" class="namenfeld leer"> </div>
    <p class="meldung klein" id="namenMeldung"></p>
    <div id="tastatur" class="tastatur"></div>
  </div>

  <!-- Bestenliste -->
  <div id="liste" class="schicht versteckt">
    <h1 class="titel-mittel">Bestenliste 🏆</h1>
    <div class="tabellen-rahmen"><table id="tabelle"></table></div>
    <div class="knoepfe">
      <button class="gross" id="listeZurueck">OK</button>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="schicht versteckt">
    <h1>Pause</h1>
    <div class="knoepfe">
      <button class="gross" id="weiter">Weiter ▶</button>
    </div>
    <button class="klein-knopf" id="abbrechen">Zurück zum Start</button>
  </div>

  <button id="pauseknopf" class="ecke versteckt" title="Pause">⏸</button>
  <button id="schwertknopf" class="schwert-knopf versteckt" title="Schwert (S)">⚔️</button>
  <button id="vollbild" class="ecke" title="Vollbild">⛶</button>

  <script src="vendor/phaser.min.js"></script>
  <script src="bestenliste.js"></script>
  <script src="game.js"></script>
  <script src="grafik.js"></script>
</body>
</html>

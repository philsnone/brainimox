name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image testweise bauen
        run: docker build -t test-image .
      - name: Container starten und /health prüfen
        run: |
          docker run -d -p 3000:3000 --name test test-image
          sleep 3
          curl -fsS http://localhost:3000/health
